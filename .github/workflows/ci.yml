name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# TODO (Phase 2.5-b, not enabled here on purpose): image build + GHCR push + SSH deploy,
# migrations-on-deploy with a mandatory pre-deploy backup, smoke tests + automatic binary
# rollback, and real Playwright E2E against a staging environment. Those need host secrets
# and a staging target; the safe runbook lives in deploy/update.sh + docs/11-deployment.md.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore new solution
        run: dotnet restore Dar.slnx
      - name: Build legacy API
        run: dotnet build backend/DarEltahfeez.Api/DarEltahfeez.Api.csproj --nologo
      - name: Build new solution
        run: dotnet build Dar.slnx --no-restore --nologo
      - name: Test
        run: dotnet test Dar.slnx --no-build --nologo
      - name: Check deploy script syntax (bash -n)
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(deploy/*.sh deploy/scripts/*.sh)
          echo "Checking ${#files[@]} deploy scripts: ${files[*]}"
          for file in "${files[@]}"; do
            bash -n "$file"
          done

  meet-recorder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/meet-recorder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/meet-recorder/package-lock.json
      - name: Install bot dependencies
        run: npm ci
      - name: Typecheck the bot
        run: npm run typecheck
      - name: Bot unit tests
        run: npm test

  migrations:    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dar
          POSTGRES_PASSWORD: dar
          POSTGRES_DB: dar_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dar -d dar_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Apply all migrations to a clean database
        env:
          ConnectionStrings__Default: "Host=127.0.0.1;Port=5432;Database=dar_ci;Username=dar;Password=dar"
        run: dotnet run --project src/Host/Dar.Api -- --migrate
      - name: Verify migrations and portal tables
        run: |
          docker exec -i -e PGPASSWORD=dar "${{ job.services.postgres.id }}" \
            psql -U dar -d dar_ci -v ON_ERROR_STOP=1 <<'SQL'
          SELECT count(*) AS migrations FROM web_schema_migrations;
          SELECT count(*) AS permissions FROM permissions;
          SELECT count(*) AS teacher_permission_defaults
          FROM role_permissions rp
          JOIN roles r ON r.id=rp.role_id
          WHERE r.code='teacher';
          SELECT count(*) AS supervisor_permission_defaults
          FROM role_permissions rp
          JOIN roles r ON r.id=rp.role_id
          WHERE r.code='supervisor';
          SELECT to_regclass('public.teacher_sessions') IS NOT NULL AS teacher_sessions_ready,
                 to_regclass('public.notifications') IS NOT NULL AS notifications_ready;
          SQL

      # The single source of truth for the applied schema is the count of SQL files in
      # database/; any drift means a migration file was added/removed without being applied.
      - name: Verify migration count matches database files
        run: |
          set -euo pipefail
          expected="$(find database -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d '[:space:]')"
          actual="$(docker exec -i -e PGPASSWORD=dar "${{ job.services.postgres.id }}" \
            psql -U dar -d dar_ci -tAc 'SELECT count(*) FROM web_schema_migrations' | tr -d '[:space:]')"
          echo "database/*.sql files = ${expected}; web_schema_migrations rows = ${actual}"
          # Invariant: every database/*.sql file was applied (no missing/extra ledger rows).
          test "${expected}" -eq "${actual}"
          echo "::notice::applied ${expected} migration(s); database/*.sql is the source of truth. Keep docs/00-current-state.md in sync when this count changes."

      # Schema invariants for the two money/schedule safety systems added in Phases 2.2/2.3.
      # The advisory-lock keys live inside the trigger bodies (not catalog-visible), so CI
      # asserts the guard triggers/functions exist instead of grepping function bodies.
      - name: Verify financial Reverse/Void schema
        run: |
          docker exec -i -e PGPASSWORD=dar "${{ job.services.postgres.id }}" \
            psql -U dar -d dar_ci -v ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          DECLARE v integer;
          BEGIN
            SELECT count(*) INTO v FROM information_schema.columns
             WHERE table_schema='public' AND table_name='monthly_charges'
               AND column_name IN ('voided_at','voided_by','void_reason');
            IF v <> 3 THEN RAISE EXCEPTION 'monthly_charges void columns expected 3, got %', v; END IF;
            SELECT count(*) INTO v FROM information_schema.columns
             WHERE table_schema='public' AND table_name='payments'
               AND column_name IN ('voided_at','voided_by','void_reason');
            IF v <> 3 THEN RAISE EXCEPTION 'payments void columns expected 3, got %', v; END IF;
            SELECT count(*) INTO v
              FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
             WHERE n.nspname='public' AND p.proname IN ('dar_void_charge','dar_void_payment');
            IF v <> 2 THEN RAISE EXCEPTION 'void functions expected 2, got %', v; END IF;
            SELECT count(*) INTO v FROM permissions WHERE code='finance.void';
            IF v <> 1 THEN RAISE EXCEPTION 'finance.void permission expected 1, got %', v; END IF;
            IF to_regclass('public.uq_monthly_charges_active_enrollment_month') IS NULL THEN
              RAISE EXCEPTION 'missing partial unique index uq_monthly_charges_active_enrollment_month';
            END IF;
            RAISE NOTICE 'financial void schema OK';
          END
          $check$;
          SQL

      - name: Verify schedule overlap protection schema
        run: |
          docker exec -i -e PGPASSWORD=dar "${{ job.services.postgres.id }}" \
            psql -U dar -d dar_ci -v ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          DECLARE v integer;
          BEGIN
            SELECT count(*) INTO v FROM pg_trigger
             WHERE NOT tgisinternal
               AND tgname IN ('trg_circle_schedule_slots_teacher_overlap','trg_circles_teacher_schedule_overlap');
            IF v <> 2 THEN RAISE EXCEPTION 'schedule overlap triggers expected 2, got %', v; END IF;
            SELECT count(*) INTO v
              FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
             WHERE n.nspname='public'
               AND p.proname IN ('dar_teacher_has_schedule_overlap','dar_guard_schedule_slot_teacher_overlap','dar_guard_circle_teacher_schedule_overlap');
            IF v <> 3 THEN RAISE EXCEPTION 'schedule overlap functions expected 3, got %', v; END IF;
            RAISE NOTICE 'schedule overlap schema OK';
          END
          $check$;
          SQL

      # Phase 3.1 Meet: the recording module owns one durable queue and one settings row.
      # The count of meet_* tables is asserted so a partially applied 026 is caught here.
      - name: Verify Meet recording schema
        run: |
          docker exec -i -e PGPASSWORD=dar "${{ job.services.postgres.id }}" \
            psql -U dar -d dar_ci -v ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          DECLARE v integer;
          BEGIN
            SELECT count(*) INTO v FROM information_schema.tables
             WHERE table_schema='public' AND table_name IN (
               'meet_calendar_accounts','meet_events','meet_event_links','meet_circle_settings',
               'meet_bot_jobs','meet_sessions','meet_media_assets','meet_settings');
            IF v <> 8 THEN RAISE EXCEPTION 'meet tables expected 8, got %', v; END IF;
            SELECT count(*) INTO v FROM meet_settings;
            IF v <> 1 THEN RAISE EXCEPTION 'meet_settings expected 1 row, got %', v; END IF;
            SELECT count(*) INTO v FROM permissions
             WHERE code IN ('meet.view','meet.manage','meet.calendar.manage','meet.media.view','meet.media.delete');
            IF v <> 5 THEN RAISE EXCEPTION 'meet permissions expected 5, got %', v; END IF;
            IF to_regclass('public.uq_meet_calendar_account_active') IS NULL THEN
              RAISE EXCEPTION 'missing partial unique index uq_meet_calendar_account_active';
            END IF;
            SELECT count(*) INTO v FROM pg_constraint
             WHERE conname = 'meet_events_recording_mode_check'
               AND pg_get_constraintdef(oid) LIKE '%exclude%';
            IF v <> 1 THEN RAISE EXCEPTION 'meet_events recording_mode check is missing'; END IF;
            RAISE NOTICE 'meet recording schema OK';
          END
          $check$;
          SQL

      # SQL regression scripts are self-contained (single transaction + ROLLBACK), so they
      # can run against the freshly migrated database without leaving rows behind.
      - name: Run financial void SQL verification
        run: |
          log=void_verify.log
          if ! docker exec -i -e PGPASSWORD=dar "${{ job.services.postgres.id }}" \
              psql -U dar -d dar_ci -v ON_ERROR_STOP=1 -f - \
              < tests/regression/sql/financial_void_verify.sql > "$log" 2>&1; then
            echo "::error::financial_void_verify.sql failed (psql exit code)"
            tail -n 120 "$log"
            exit 1
          fi
          tail -n 40 "$log"
          if grep -q 'FAIL' "$log"; then
            echo "::error::financial void verification reported FAIL scenarios"
            exit 1
          fi

      - name: Run teacher schedule overlap SQL verification
        run: |
          log=overlap_verify.log
          if ! docker exec -i -e PGPASSWORD=dar "${{ job.services.postgres.id }}" \
              psql -U dar -d dar_ci -v ON_ERROR_STOP=1 -f - \
              < tests/regression/sql/schedule_overlap_verify.sql > "$log" 2>&1; then
            echo "::error::schedule_overlap_verify.sql failed (its internal gate raises on any FAIL)"
            tail -n 120 "$log"
            exit 1
          fi
          tail -n 20 "$log"

      - name: Run schedule overlap hardening SQL verification
        run: |
          log=overlap_hardening_verify.log
          if ! docker exec -i -e PGPASSWORD=dar "${{ job.services.postgres.id }}" \
              psql -U dar -d dar_ci -v ON_ERROR_STOP=1 -f - \
              < tests/regression/sql/schedule_overlap_hardening_verify.sql > "$log" 2>&1; then
            echo "::error::schedule_overlap_hardening_verify.sql failed (advisory locks / atomic guards)"
            tail -n 120 "$log"
            exit 1
          fi
          tail -n 20 "$log"
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck (tsc -b --force)
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  api-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/api-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: packages/api-client/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # openapi-typescript regenerates src/schema.d.ts from the committed spec; the diff
      # must stay empty. A stale generated client is contract drift.
      - name: Generated schema check (no drift)
        run: |
          npm run generate
          git diff --exit-code -- src/schema.d.ts


  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: .NET vulnerable packages
        run: dotnet list Dar.slnx package --vulnerable --include-transitive
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Frontend audit
        run: npm audit --omit=dev --prefix frontend
      - name: API client audit
        run: npm audit --omit=dev --prefix packages/api-client
      - name: Secret scan
        run: |
          if git grep -nE '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|xox[baprs]-[A-Za-z0-9-]+|AIza[0-9A-Za-z_-]{35})' -- .; then
            echo "Potential secret pattern found in tracked files."
            exit 1
          fi