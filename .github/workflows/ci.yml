name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore new solution
        run: dotnet restore Dar.slnx
      - name: Build legacy API
        run: dotnet build backend/DarEltahfeez.Api/DarEltahfeez.Api.csproj --nologo
      - name: Build new solution
        run: dotnet build Dar.slnx --no-restore --nologo
      - name: Test
        run: dotnet test Dar.slnx --no-build --nologo

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  api-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/api-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: packages/api-client/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose stack
        run: docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml config > /dev/null

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: .NET vulnerable packages
        run: dotnet list Dar.slnx package --vulnerable --include-transitive
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Frontend audit
        run: npm audit --omit=dev --prefix frontend
      - name: API client audit
        run: npm audit --omit=dev --prefix packages/api-client
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
