<!doctype html>
<meta charset="utf-8">
<button style="position:fixed;inset:0">enable audio</button>
<script src="/livekit.js"></script>
<script>
const LK = window.LivekitClient
const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms))

// A real remote WebRTC audio track, looped back inside the page (no server).
async function remoteTrack() {
  const source = new AudioContext()
  const oscillator = source.createOscillator()
  const out = source.createMediaStreamDestination()
  oscillator.connect(out)
  oscillator.start()
  const a = new RTCPeerConnection()
  const b = new RTCPeerConnection()
  a.onicecandidate = (e) => e.candidate && b.addIceCandidate(e.candidate)
  b.onicecandidate = (e) => e.candidate && a.addIceCandidate(e.candidate)
  const received = new Promise((resolve) => { b.ontrack = resolve })
  a.addTrack(out.stream.getAudioTracks()[0], out.stream)
  await a.setLocalDescription()
  await b.setRemoteDescription(a.localDescription)
  await b.setLocalDescription()
  await a.setRemoteDescription(b.localDescription)
  return received
}

async function main() {
  // Leave the runner time to issue its automation call first.
  await wait(1500)
  const room = new LK.Room()
  const element = document.createElement('audio')
  const report = (name) => console.log('PROBE ' + JSON.stringify({
    name, canPlay: room.canPlaybackAudio, paused: element.paused,
  }))

  await room.acquireAudioContext(true) // the first thing room.connect() does
  const { track, receiver } = await remoteTrack()
  const audio = new LK.RemoteAudioTrack(track, 'TR_probe', receiver)
  // The same two subscriptions the SDK adds for every subscribed audio track.
  audio.on(LK.TrackEvent.AudioPlaybackFailed, room.handleAudioPlaybackFailed)
  audio.on(LK.TrackEvent.AudioPlaybackStarted, room.handleAudioPlaybackStarted)
  element.autoplay = true
  document.body.appendChild(element)

  document.querySelector('button').onclick = async () => {
    // Without a server the room has no remote participants, so replay the element here.
    await Promise.all([room.startAudio(), element.play()])
    await wait(300)
    report('clicked')
  }

  audio.attach(element)
  await wait(1000)
  report('attached')
}
main()
</script>
