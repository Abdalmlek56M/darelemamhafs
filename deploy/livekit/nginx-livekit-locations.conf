    # LiveKit test endpoint (M0 spike): WSS signaling only; media is direct UDP/TCP.
    # Feature-flagged: only install after deploy/livekit/install-livekit-test.sh
    # --enable-livekit-test succeeded; merge this file into the Dar vhost by hand.
    # Media ports: 7882/udp + 7881/tcp stay CLOSED unless the owner opens them
    # (--open-media-ports); closing them again is an owner action (BLOCKED for agents).
    # The public /live-test/ page is NOT part of this snippet: it is gated in
    # deploy/livekit/nginx-livekit-test-page.conf.disabled (--with-test-page).
    location ^~ /livekit/ {
        proxy_pass http://127.0.0.1:7880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
