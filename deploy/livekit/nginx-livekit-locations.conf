    # LiveKit test endpoint (M0 spike): WSS signaling only; media is direct UDP/TCP.
    # Media ports: 7882/udp + 7881/tcp (opened in UFW by deploy/livekit/install-livekit-test.sh).
    location ^~ /livekit/ {
        proxy_pass http://127.0.0.1:7880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Static LiveKit test page (temporary; not linked from the product).
    location ^~ /live-test/ {
        alias /var/www/live-test/;
        index index.html;
        try_files $uri $uri/ /live-test/index.html;
    }
