# Reference copy of the live vhost. The canonical generator is deploy/setup-nginx.sh
# (buffers/timeouts/HSTS/security headers/certbot block). Regenerate with:
#   sudo bash deploy/setup-nginx.sh
# Do not hand-edit the live file without updating setup-nginx.sh, or the next run will drift.
# Real-client-IP mode is a single setting: DAR_REAL_IP_MODE=cloudflare|direct.
# cloudflare installs deploy/nginx/cloudflare-realip.conf (CF published ranges + CF-Connecting-IP).
# Both modes pass nginx's resolved $remote_addr, never a client-supplied X-Forwarded-For chain.

server {
    server_name deployment.example.invalid;

    client_max_body_size 12m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # FINAL 1.25: the bot control plane is loopback-only; never proxy /internal/* publicly.
    location ^~ /internal/ { return 404; }

    location /api/v1/ {
        proxy_pass http://127.0.0.1:5081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
        proxy_read_timeout 180s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/deployment.example.invalid/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/deployment.example.invalid/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = deployment.example.invalid) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name deployment.example.invalid;
    return 404; # managed by Certbot


}