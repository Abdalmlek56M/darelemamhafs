# Dar per-IP request limiting zones + compression for the edge Nginx.
#
# Installed by deploy/setup-nginx.sh to /etc/nginx/conf.d/00-dar-ratelimit.conf.
# limit_req_zone is only allowed in the http{} context, so the zones are declared
# here (conf.d is included from http{}) and the Dar vhost references them by name:
#   location /           -> dar_general
#   location /api/v1/    -> dar_api
#   location /api/auth/  -> dar_auth (login/setup brute-force protection)
# gzip is enabled per server block ("gzip on;") and configured once here.
#
# The reference vhost is deploy/nginx/dar-elemam-hafs.conf; the generator is
# deploy/setup-nginx.sh. Keep all three in sync.
#
# Tuning notes:
#   * 10m of state is ~160k distinct client IPs per zone - far more than this
#     single-school deployment needs.
#   * nginx returns 429 (limit_req_status) for limited requests; Cloudflare should
#     be configured to pass 429 through.
#   * rate=5r/m on the credential endpoints: 5 requests per minute per IP is
#     generous for a real admin and far too slow for credential stuffing.

limit_req_zone $binary_remote_addr zone=dar_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=dar_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=dar_auth:10m rate=5r/m;

limit_req_status 429;

# Compression (JSON/JS/CSS compress ~4-6x; already-compressed media is untouched).
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml font/woff2;
