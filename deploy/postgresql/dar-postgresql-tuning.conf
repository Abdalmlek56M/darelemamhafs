# =============================================================================
# Dar PostgreSQL 17 tuning fragment (4 vCPU / 8 GB RAM / 100 GB SSD host)
# =============================================================================
# Stock Ubuntu PostgreSQL targets a 1 GB VM, so it under-uses the production host:
# shared_buffers=128MB, work_mem=4MB, maintenance_work_mem=64MB, max_connections=100,
# effective_cache_size=4GB, random_page_cost=4, effective_io_concurrency=1,
# max_wal_size=1GB. This fragment raises them for the Contabo VPS profile while
# staying inside 8GB of RAM.
#
# How to apply (owner action, host only - never executed by CI/agents):
#   sudo cp deploy/postgresql/dar-postgresql-tuning.conf \
#     /etc/postgresql/17/main/conf.d/00-dar-tuning.conf
#   sudo chown root:postgres /etc/postgresql/17/main/conf.d/00-dar-tuning.conf
#   sudo chmod 0640 /etc/postgresql/17/main/conf.d/00-dar-tuning.conf
#   sudo systemctl restart postgresql
#   # verify:
#   sudo -u postgres psql -tAc "SHOW shared_buffers; SHOW work_mem; SHOW max_connections;"
# Ubuntu's postgresql.conf ships `include_dir = 'conf.d'`, so files there are read last
# and override the earlier values. To roll back: delete the file and restart.
# Docs: docs/runbooks/db-roles-and-tuning.md
# =============================================================================

# ---- memory ----
# 25% of RAM is the classic OLTP starting point. 2GB (stock: 128MB).
shared_buffers = 2GB
# Planner estimate of OS page cache; ~75% of RAM minus shared_buffers. (stock: 4GB)
effective_cache_size = 6GB
# Per-sort/hash operation; this app has admin list/report queries. (stock: 4MB)
work_mem = 16MB
# VACUUM, CREATE INDEX, pg_restore. (stock: 64MB)
maintenance_work_mem = 512MB
# (stock: -1 = auto, usually 16MB on a 8GB host)
wal_buffers = 16MB
# (stock: try)
huge_pages = try

# ---- connections ----
# Two APIs + backup/healthcheck/restore-drill + admin sessions. (stock: 100)
max_connections = 200

# ---- write-ahead log / checkpoints (stock: min 80MB, max 1GB) ----
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
# pglz is always available; lz4 needs a build with lz4 support (Ubuntu 17 has it).
wal_compression = on

# ---- planner (SSD-backed host; stock: random_page_cost 4, io concurrency 1) ----
random_page_cost = 1.1
effective_io_concurrency = 200
maintenance_io_concurrency = 200
default_statistics_target = 100

# ---- autovacuum (stock: 3 workers, 1min naptime) ----
autovacuum_max_workers = 4
autovacuum_naptime = 30s

# ---- guard rails: kill runaway/idle transactions, never hang a deploy ----
# 5 minutes for a session sitting idle inside a transaction (stock: 0 = forever).
idle_in_transaction_session_timeout = 300000
# 5 seconds waiting for a lock before erroring (stock: 0 = forever).
lock_timeout = 5000
# Keep statement_timeout at 0: the admin reports/backups can legitimately run longer;
# per-endpoint timeouts belong in the API, not the shared cluster.
statement_timeout = 0

# ---- observability (cheap on this hardware) ----
track_io_timing = on
log_checkpoints = on
log_lock_waits = on
log_temp_files = 10240
log_min_duration_statement = 1000
# Optional (needs postgresql-contrib, already installed by the host baseline):
# shared_preload_libraries = 'pg_stat_statements'
# pg_stat_statements.max = 10000
# pg_stat_statements.track = all
