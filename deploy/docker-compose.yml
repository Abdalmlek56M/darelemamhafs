name: dar

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dareltahfeez}
      POSTGRES_USER: ${POSTGRES_USER:-dar_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dar

  migrate:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-dareltahfeez};Username=${POSTGRES_USER:-dar_app};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - dar

  legacy-api:
    build:
      context: ..
      dockerfile: deploy/legacy.Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DarDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB:-dareltahfeez};Username=${POSTGRES_USER:-dar_app};Password=${POSTGRES_PASSWORD}
      Database__ApplyMigrationsOnStartup: "false"
      Backup__RootPath: /var/lib/dar/backups
      Auth__SetupToken: ${SETUP_TOKEN:-}
      ForwardedHeaders__KnownProxies__0: ${CADDY_PROXY_IP:-172.28.0.10}
    volumes:
      - backups:/var/lib/dar/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dar

  new-api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-dareltahfeez};Username=${POSTGRES_USER:-dar_app};Password=${POSTGRES_PASSWORD}
      Auth__Otp__Pepper: ${OTP_PEPPER:?set OTP_PEPPER in deploy/.env}
      Auth__Smtp__Host: ${SMTP_HOST:-}
      Auth__Smtp__Port: ${SMTP_PORT:-587}
      Auth__Smtp__User: ${SMTP_USER:-}
      Auth__Smtp__Password: ${SMTP_PASSWORD:-}
      Auth__Smtp__From: ${SMTP_FROM:-}
      Auth__Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Auth__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      ForwardedHeaders__KnownProxies__0: ${CADDY_PROXY_IP:-172.28.0.10}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dar

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DAR_DOMAIN: ${DAR_DOMAIN:-darelemamhaf.rigxhardware.com}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      legacy-api:
        condition: service_healthy
      new-api:
        condition: service_healthy
    networks:
      dar:
        ipv4_address: 172.28.0.10

volumes:
  pgdata:
  backups:
  caddy_data:
  caddy_config:

networks:
  dar:
    ipam:
      config:
        - subnet: 172.28.0.0/16
